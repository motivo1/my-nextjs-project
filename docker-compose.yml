services:
  web_blue:
    build: .
    container_name: my-nextjs-blue
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  web_green:
    build: .
    container_name: my-nextjs-green
    environment:
      - NODE_ENV=production
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: my-nextjs-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    depends_on:
      - web_blue
      - web_green
